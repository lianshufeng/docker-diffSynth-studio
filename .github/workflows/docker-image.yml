          # docker build -f .devops/cpu.Dockerfile -t $IMAGE_NAME .
          # docker push $IMAGE_NAME
# gpu image
      - name: Build and push latest
        working-directory: ./
        run: |
          IMAGE_NAME=lianshufeng/diffSynth-studio:latest
          docker build -f .Dockerfile -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Build and push GPU image
        working-directory: ./
        run: |
          IMAGE_NAME=lianshufeng/diffSynth-studio:gpu
          docker build -f .Dockerfile -t $IMAGE_NAME .
          docker push $IMAGE_NAME

